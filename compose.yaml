services:
  garden:
    build: .
    image: garden-tracker
    container_name: garden
    restart: unless-stopped
    ports:
      - "8000:8000"          # change the left side to publish on another port, e.g. "80:8000"
    volumes:
      - garden-data:/data    # garden.db and backups/ live here
    # Nothing needs setting: pick your location in the app on first open.
    # Optional overrides, see deploy/garden.env.example for the full list:
    # environment:
    #   GARDEN_TZ: Europe/London
    #   GARDEN_WEATHER: "0"   # never call Open-Meteo

volumes:
  garden-data:
